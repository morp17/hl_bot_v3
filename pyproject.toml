[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hyperliquid-production-bot"
version = "3.0.0"
description = "Bot de trading profissional para Hyperliquid DEX com multi-symbol, staking, proteção de capital e dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hyperliquid Bot Team"},
]
keywords = ["hyperliquid", "trading", "bot", "crypto", "dex", "perpetual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "hyperliquid-python-sdk>=0.6.0",
    "ccxt>=4.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
notifications = [
    "telegram>=0.0.1",
    "discord.py>=2.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["crypto_bot_core"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
# FIX (item 3 — endurecimento gradual): strict global permanece False.
# Ativar strict=True globalmente sem uma auditoria completa quebraria o
# CI com um volume desconhecido de erros em módulos legados nunca
# tipados sob esse regime. Em vez disso, strict é aplicado seletivamente
# via [[tool.mypy.overrides]] abaixo, apenas nos módulos já auditados
# nesta rodada de correções (risco, execução, ledger, dashboard).
strict = false
ignore_missing_imports = true
disallow_any_unimported = false
warn_unused_ignores = true
warn_redundant_casts = true

# Módulos com strict=True: já passaram por revisão linha a linha nesta
# auditoria (type hints, tratamento de exceções, validação de inputs
# documentados explicitamente como requisito em cada docstring). Novos
# módulos devem ser adicionados aqui à medida que forem auditados —
# meta final é strict=True global quando a lista cobrir o projeto todo.
[[tool.mypy.overrides]]
module = [
    "crypto_bot_core.risk",
    "crypto_bot_core.capital_protection",
    "crypto_bot_core.trade_ledger",
    "crypto_bot_core.execution",
]
strict = true
disallow_untyped_defs = true
