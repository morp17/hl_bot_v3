# This workflow will install Python dependencies, run type checks, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Type check (strict) — módulos auditados
      # FIX (item 3): bloqueante. Cobre apenas os módulos com
      # strict=True em pyproject.toml (ver overrides) — já auditados
      # linha a linha, então uma falha aqui É uma regressão real.
      run: |
        mypy crypto_bot_core/risk.py crypto_bot_core/capital_protection.py crypto_bot_core/trade_ledger.py crypto_bot_core/execution.py
    - name: Type check (informativo) — projeto completo
      # Não bloqueante até o projeto inteiro passar por auditoria de
      # tipos e ser promovido para a lista de overrides strict acima.
      continue-on-error: true
      run: |
        mypy crypto_bot_core/ main.py